schema_version: 1

context:
  version: "7.17.0"

package:
  name: coverage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/coverage/coverage-${{ version }}.tar.gz
  sha256: cc010a0a7fbdd9bb8bdfd0d3f04a5151275860213cbd7e2b876b29778489c712

build:
  number: 0
  noarch: ${{ "python" if use_noarch }}
  variant:
    down_prioritize_variant: ${{ 1 if use_noarch else 0 }}
  python:
    entry_points:
      - coverage = coverage.cmdline:main

requirements:
  build:
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - if: not use_noarch
      then:
        - if: build_platform != target_platform
          then: python
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
  host:
    - if: use_noarch
      then: python ${{ python_min }}.*
      else: python
    - pip
    - setuptools
  run:
    - if: use_noarch
      then: python >=${{ python_min }}
      else: python
    # extra dependency
tests:
  - if: use_noarch
    then:
      - python:
          imports:
            - coverage
          python_version: ${{ python_min }}.*
          pip_check: true
      - script:
          - coverage --help
        requirements:
          run:
            - python ${{ python_min }}.*
    else:
      - python:
          imports:
            - coverage
          pip_check: true
      - script:
          - coverage --help

about:
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: Code coverage measurement for Python
  homepage: https://coverage.readthedocs.io

extra:
  recipe-maintainers:
    - thewchan
    - ericmjl
    - jakirkham
    - ocefpaf
